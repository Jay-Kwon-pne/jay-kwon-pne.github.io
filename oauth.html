<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Auth Callback</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; line-height: 1.6; color: #222; background: #fff; }
  h1 { color: #4D148C; }
  textarea { width: 100%; height: 90px; font-family: monospace; }
  button { background: #4D148C; color: #fff; border: 0; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>
<h1>Authorization complete</h1>
<p>Copy the full URL below and paste it into the local setup script. This page does not send the code anywhere.</p>
<textarea id="u" readonly></textarea>
<p><button id="c">Copy URL</button> <span id="s"></span></p>
<script>
  var u = document.getElementById('u');
  u.value = location.href;
  document.getElementById('c').onclick = function () {
    u.select();
    try { navigator.clipboard.writeText(u.value); } catch (e) { document.execCommand('copy'); }
    document.getElementById('s').textContent = 'Copied';
  };
</script>
</body>
</html>
